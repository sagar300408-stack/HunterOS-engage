image:
  repository: hunteros-engage
  pullPolicy: IfNotPresent
  tag: "latest"

api:
  replicaCount: 2

worker:
  replicaCount: 2

scheduler:
  replicaCount: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: hunteros.local
      paths:
        - path: /
          pathType: ImplementationSpecific

config:
  ENVIRONMENT: production
  DEBUG: "False"

secrets:
  SECRET_KEY: "change-this-in-production"
  DATABASE_URL: "postgresql+asyncpg://postgres:password@postgres-service:5432/hunteros"
  REDIS_URL: "redis://redis-service:6379/0"
  CELERY_BROKER_URL: "redis://redis-service:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/2"
