apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hunteros.fullname" . }}-api
  labels:
    app: {{ include "hunteros.name" . }}-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "hunteros.name" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "hunteros.name" . }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 15
          envFrom:
            - configMapRef:
                name: {{ include "hunteros.fullname" . }}-config
            - secretRef:
                name: {{ include "hunteros.fullname" . }}-secrets
