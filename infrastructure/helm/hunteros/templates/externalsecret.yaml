{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "hunteros.fullname" . }}-secrets
  labels:
    {{- include "hunteros.labels" . | nindent 4 }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager # Configurable in a real environment
    kind: ClusterSecretStore
  target:
    name: {{ include "hunteros.fullname" . }}-secrets
    creationPolicy: Owner
  data:
  - secretKey: SECRET_KEY
    remoteRef:
      key: hunteros/prod/app
      property: SECRET_KEY
  - secretKey: DATABASE_URL
    remoteRef:
      key: hunteros/prod/database
      property: DATABASE_URL
  - secretKey: REDIS_URL
    remoteRef:
      key: hunteros/prod/redis
      property: REDIS_URL
  - secretKey: CELERY_BROKER_URL
    remoteRef:
      key: hunteros/prod/celery
      property: CELERY_BROKER_URL
  - secretKey: CELERY_RESULT_BACKEND
    remoteRef:
      key: hunteros/prod/celery
      property: CELERY_RESULT_BACKEND
{{- end }}
